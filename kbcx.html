<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>学院课表智能分析工具</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
         background:#f1f5f9; color:#1e293b; padding:18px; min-height:100vh; }
  .wrap { max-width:1220px; margin:0 auto; }

  /* ---------- 顶部 ---------- */
  .hero { background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff;
          border-radius:14px; padding:22px 28px; box-shadow:0 6px 24px rgba(37,99,235,.25);
          display:flex; align-items:center; justify-content:space-between;
          flex-wrap:wrap; gap:14px; }
  .hero h1 { font-size:21px; letter-spacing:.5px; }
  .hero .sub { font-size:12px; opacity:.8; margin-top:6px; }
  .hero-stats { display:flex; gap:22px; flex-wrap:wrap; }
  .hero-stat { text-align:center; }
  .hero-stat .num { font-size:22px; font-weight:700; }
  .hero-stat .lbl { font-size:11px; opacity:.75; margin-top:2px; }

  /* ---------- 面板 / 工具栏 ---------- */
  .panel { background:#fff; border-radius:12px; padding:18px 22px; margin-top:16px;
           box-shadow:0 2px 10px rgba(15,23,42,.06); }
  .toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:12px; font-weight:700; color:#64748b; letter-spacing:.3px; }

  /* ★ 下拉框：桌面 + 移动统一美化 */
  select {
    width:100%; min-width:180px;
    padding:10px 36px 10px 12px;
    font-size:14px; font-family:inherit; color:#1e293b; font-weight:500;
    background-color:#fff;
    border:1.5px solid #cbd5e1; border-radius:8px;
    cursor:pointer; transition:.18s;
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%23475569' d='M6 8L0 0h12z'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:10px 7px;
    text-overflow:ellipsis;
  }
  select:hover { border-color:#94a3b8; }
  select:focus { outline:none; border-color:#2563eb;
                 box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  select:disabled { background-color:#f1f5f9; color:#94a3b8; cursor:not-allowed; }

  button { padding:9px 18px; border:none; border-radius:8px; font-size:13px;
           font-weight:700; cursor:pointer; transition:.18s;
           font-family:inherit; white-space:nowrap; }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none !important; }
  .btn-primary { background:#2563eb; color:#fff; }
  .btn-primary:hover:not(:disabled) { background:#1d4ed8; transform:translateY(-1px); }
  .btn-green { background:#059669; color:#fff; }
  .btn-green:hover:not(:disabled) { background:#047857; transform:translateY(-1px); }

  /* 时段多选 */
  .slot-picker { display:flex; flex-wrap:wrap; gap:6px; max-width:560px; }
  .slot-btn { padding:6px 10px; border:1.5px solid #cbd5e1; background:#fff;
              border-radius:6px; font-size:12px; color:#475569; cursor:pointer;
              font-weight:600; transition:.15s; font-family:inherit; }
  .slot-btn:hover { border-color:#2563eb; color:#2563eb; }
  .slot-btn.active { background:#2563eb; border-color:#2563eb; color:#fff; }

  /* ---------- 结果区 ---------- */
  .result-head { display:flex; align-items:baseline; justify-content:space-between;
                 gap:12px; flex-wrap:wrap; margin-bottom:14px;
                 padding-bottom:12px; border-bottom:2px solid #e2e8f0; }
  .result-title { font-size:17px; font-weight:700; color:#0f172a; }
  .result-sub { font-size:12.5px; color:#64748b; }

  /* ---------- 课表网格 ---------- */
  .grid-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch;
                 border-radius:10px; box-shadow:0 1px 6px rgba(15,23,42,.07); }
  .grid-scroll::-webkit-scrollbar { height:7px; }
  .grid-scroll::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
  .scroll-hint { display:none; }
  .grid-table { width:100%; min-width:680px; border-collapse:separate;
                border-spacing:0; table-layout:fixed; border-radius:10px; overflow:hidden; }
  .grid-table th { background:#1e293b; color:#fff; font-size:12.5px; font-weight:700;
                   padding:10px 6px; text-align:center; letter-spacing:.5px; }
  .grid-table th:first-child { background:#0f172a; width:74px; }
  .grid-table td { border-top:1px solid #e2e8f0; border-left:1px solid #e2e8f0;
                   padding:6px; vertical-align:top; height:96px; background:#fff; }
  .grid-table tr td:first-child { background:#f8fafc; border-left:none; text-align:center;
                                  font-weight:700; font-size:12px; color:#475569; vertical-align:middle; }
  .grid-table tr:first-child td { border-top:none; }
  .grid-table td:last-child { border-right:none; }
  .cell-empty { text-align:center; color:#cbd5e1; font-size:12px; padding-top:6px; }

  .ccard { background:#eff6ff; border-left:3px solid #2563eb; border-radius:6px;
           padding:5px 7px; margin-bottom:4px; text-align:left; line-height:1.45; }
  .ccard:last-child { margin-bottom:0; }
  .ccard.combined { background:#fef3c7; border-left-color:#d97706; }
  .ccard .cname { font-size:12px; font-weight:700; color:#1e3a8a; display:block;
                  margin-bottom:2px; word-break:break-word; }
  .ccard.combined .cname { color:#92400e; }
  .ccard .cmeta { font-size:11px; color:#64748b; display:block; word-break:break-word; }
  .ccard .badge { display:inline-block; font-size:9.5px; background:#fbbf24; color:#78350f;
                  border-radius:4px; padding:1px 5px; margin-left:4px;
                  font-weight:700; vertical-align:middle; }

  .lst { width:100%; border-collapse:separate; border-spacing:0; border-radius:10px;
         overflow:hidden; box-shadow:0 1px 6px rgba(15,23,42,.07); }
  .lst th { background:#1e293b; color:#fff; font-size:12.5px; padding:10px 12px;
            text-align:left; font-weight:700; }
  .lst td { padding:9px 12px; font-size:12.5px; border-top:1px solid #e2e8f0; background:#fff; }
  .lst tr:nth-child(even) td { background:#f8fafc; }
  .lst tr:hover td { background:#eff6ff; }

  .hidden { display:none !important; }

  /* ★ 空闲查询卡片 */
  .free-card { border:1px solid #e2e8f0; border-radius:10px; padding:14px 16px;
               margin-bottom:12px; background:#fff; }
  .free-card.common { background:linear-gradient(135deg,#ecfdf5,#f0fdf4);
                      border:1.5px solid #10b981; box-shadow:0 2px 8px rgba(16,185,129,.12); }
  .free-head { font-size:14px; font-weight:700; color:#0f172a; margin-bottom:10px;
               padding-bottom:8px; border-bottom:1px solid #e2e8f0; display:flex;
               justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
  .free-card.common .free-head { color:#065f46; border-bottom-color:#a7f3d0; }
  .free-head .badge { font-size:11px; padding:2px 8px; border-radius:99px;
                      background:#d1fae5; color:#065f46; font-weight:700; }
  .free-sec { font-size:13px; line-height:1.9; color:#334155; margin-top:6px; }
  .free-label { color:#059669; font-weight:700; }
  .busy-label { color:#b91c1c; font-weight:700; }
  .free-extra { color:#94a3b8; font-size:11.5px; margin-left:2px; }
  .free-names { display:inline; }
  .free-name { display:inline-block; padding:1px 7px; margin:2px 3px 2px 0;
               background:#f1f5f9; border-radius:99px; font-size:12px; color:#334155; }
  .free-card.common .free-name { background:#d1fae5; color:#065f46; font-weight:600; }
  .free-name.busy { background:#fee2e2; color:#991b1b; }

  /* ---------- 全系总课表 ---------- */
  .all-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch;
                box-shadow:0 1px 6px rgba(15,23,42,.07); }
  .all-scroll::-webkit-scrollbar { height:9px; }
  .all-scroll::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
  .all-table { border-collapse:separate; border-spacing:0; background:#fff; }
  .all-table th { background:#1e293b; color:#fff; font-size:12px; font-weight:700;
                  padding:8px 4px; text-align:center; white-space:nowrap;
                  border-left:1px solid #334155; }
  .all-table thead tr:first-child th { background:#0f172a; }
  .all-table th.sub { font-size:11px; font-weight:600; color:#cbd5e1; }
  .all-table th.corner { background:#0f172a; position:sticky; left:0; z-index:3; }
  .all-table td { border-top:1px solid #e2e8f0; border-left:1px solid #e2e8f0;
                  padding:4px; vertical-align:top; height:68px; background:#fff; }
  .all-table td.cls-cell { background:#f8fafc; border-left:none; text-align:center;
                           vertical-align:middle; font-weight:700; font-size:12px; color:#1e3a8a;
                           white-space:nowrap; padding:6px 10px;
                           position:sticky; left:0; z-index:2;
                           box-shadow:1px 0 0 #e2e8f0, 4px 0 8px -4px rgba(15,23,42,.10); }
  .all-table .mini { background:#eff6ff; border-left:2px solid #2563eb; border-radius:4px;
                     padding:3px 5px; margin-bottom:3px; line-height:1.35; }
  .all-table .mini:last-child { margin-bottom:0; }
  .all-table .mini.combined { background:#fef3c7; border-left-color:#d97706; }
  .all-table .mini .cname { display:block; font-size:11.5px; font-weight:700;
                            color:#1e3a8a; word-break:break-word; }
  .all-table .mini.combined .cname { color:#92400e; }
  .all-table .mini .cmeta { display:block; font-size:10px; color:#64748b; word-break:break-word; }
  .all-table .cell-empty { text-align:center; color:#e2e8f0; font-size:13px; }

  /* ★ Toast */
  .toast { position:fixed; left:50%; bottom:24px;
           transform:translateX(-50%) translateY(80px);
           background:#1e293b; color:#fff; padding:10px 20px;
           border-radius:8px; font-size:13px; opacity:0;
           transition:opacity .25s, transform .25s;
           z-index:9999; pointer-events:none;
           max-width:88%; text-align:center;
           box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- 移动端 ---------- */
  @media (max-width:720px) {
    body { padding:10px; }
    .panel { padding:14px 16px; border-radius:10px; }
    .hero { padding:18px 20px; border-radius:12px; }
    .hero h1 { font-size:17px; }
    .hero-stats { gap:16px; }
    .hero-stat .num { font-size:18px; }
    .toolbar { flex-direction:column; align-items:stretch; gap:10px; }
    .field { width:100%; }

    /* ★★★ 手机下拉框：大字号（16px 防 iOS 缩放）、大高度、明显箭头 ★★★ */
    select {
      min-width:0; width:100%;
      font-size:16px; font-weight:500;
      height:50px; line-height:1.2;
      padding:0 42px 0 14px;
      border-radius:10px;
      border-width:1.5px;
      background-position:right 14px center;
      background-size:12px 8px;
    }
    .toolbar > button { width:100%; padding:13px; font-size:15px; border-radius:10px; }

    .slot-picker { max-width:100%; }
    .slot-btn { flex:1 1 calc(33% - 6px); padding:9px 4px; font-size:12px; }

    .result-title { font-size:15px; }
    .result-sub { font-size:11.5px; }
    .scroll-hint { display:block; text-align:center; font-size:11.5px; color:#64748b;
                   background:#f8fafc; border:1px dashed #cbd5e1; border-radius:6px;
                   padding:6px 10px; margin-bottom:8px; }
    .grid-scroll { margin:0 -16px; padding:0 16px; border-radius:0; box-shadow:none; }
    .grid-table { min-width:660px; font-size:11px; }
    .grid-table th:first-child, .grid-table td:first-child { position:sticky; left:0; z-index:2; }
    .grid-table thead th:first-child { z-index:3; }
    .ccard { padding:4px 6px; border-left-width:2px; margin-bottom:3px; }
    .ccard .cname { font-size:11px; }
    .ccard .cmeta { font-size:10px; line-height:1.35; word-break:break-all; }
    .all-table td { padding:3px; height:62px; }
    .all-table td.cls-cell { font-size:11px; padding:5px 8px; }
    .free-card { padding:12px 14px; }
    .free-sec { font-size:12.5px; }
    .toast { bottom:16px; font-size:12.5px; padding:9px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero" style="display:none;">
    <div>
      <h1>学院课表智能分析工具</h1>
      <div class="sub">数据内置 · 支持按教师 / 班级 / 教室 / 课程 / 空闲查询</div>
    </div>
    <div class="hero-stats" id="heroStats"></div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <div class="field">
        <label>查询类型</label>
        <select id="qType" onchange="onTypeChange()">
          <option value="all">全系总课表</option>
          <option value="teacher">按教师查询</option>
          <option value="class">按班级查询</option>
          <option value="classroom">按教室查询占用</option>
          <option value="course">按课程查授课</option>
          <option value="free">教师空闲查询</option>
        </select>
      </div>

      <div class="field" id="targetField">
        <label id="targetLabel">年级筛选</label>
        <select id="qTarget"></select>
      </div>

      <div class="field" id="slotField" style="display:none;">
        <label>选择时段（可多选）</label>
        <div class="slot-picker" id="slotPicker"></div>
      </div>

      <button class="btn-primary" id="btnQuery" onclick="doQuery()" disabled>刷新总课表</button>
      <button class="btn-green" id="btnExport" onclick="exportExcel()" style="display:none;">导出 Excel</button>
    </div>
  </div>

  <div class="panel hidden" id="resultPanel">
    <div class="result-head">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-sub" id="resultSub"></div>
    </div>
    <div id="resultBody"></div>
  </div>

</div>

<div id="toast" class="toast"></div>

  return {

    courses : (sys.courses  || []).map(c => [c.id, c.name]),
    classes : (sys.classes  || []).map(c => [c.id, c.name, c.grade || '']),
    rooms   : (sys.classrooms || []).map(r => [r.id, r.name, r.type || '']),
    combined: (sys.combinedGroups || []).map(g => [g.id, g.name, g.classIds || []]),
    schedule,
    external: ext
  };
}

function commonPrefix(strs) {
  if (!strs.length) return '';
  let p = strs[0];
  for (let i = 1; i < strs.length; i++) {
    while (p && strs[i].indexOf(p) !== 0) p = p.slice(0, -1);
    if (!p) return '';
  }
  return p;
}
function buildCombName(names) {
  if (!names.length) return '';
  if (names.length === 1) return names[0];
  const p = commonPrefix(names);
  const parts = names.map((n, i) => i === 0 ? n : (n.slice(p.length) || n));
  return parts[0] + ' +' + parts.slice(1).join(' +');
}

function buildIndex() {
  teacherById = {}; courseById = {}; classById = {}; roomById = {}; combById = {};
  DB.teachers.forEach(([id, name]) => teacherById[id] = name);
  DB.courses.forEach(([id, name]) => courseById[id] = name);
  DB.classes.forEach(([id, name, grade]) => classById[id] = { name, grade });
  DB.rooms.forEach(([id, name, type]) => roomById[id] = { name, type });
  (DB.combined || []).forEach(([id, name, ids]) => combById[id] = { name, classIds: ids });

  entries = DB.schedule.map(([classId, day, session, courseId, teacherId, roomId, combId]) => {
    let combName = '';
    if (combId && combById[combId]) {
      const g = combById[combId];
      combName = (g.classIds && g.classIds.length)
        ? buildCombName(g.classIds.map(cid =>
            (classById[cid] && classById[cid].name) || ('班级' + cid)))
        : (g.name || '');
    }
    return {
      classId, day, session, courseId, teacherId, roomId, combId,
      className: (classById[classId] && classById[classId].name) || ('班级' + classId),
      classGrade: (classById[classId] && classById[classId].grade) || '',
      courseName: courseById[courseId] || ('课程' + courseId),
      teacherName: teacherById[teacherId] || ('教师' + teacherId),
      roomName: (roomById[roomId] && roomById[roomId].name) || (roomId ? ('教室' + roomId) : ''),
      roomType: (roomById[roomId] && roomById[roomId].type) || '',
      combName, isExternal: false
    };
  });

  externalEntries = (DB.external || []).map(e => ({
    classId: null, day: e.day, session: e.session,
    courseId: e.courseId, teacherId: e.teacherId, roomId: null, combId: null,
    className: e.className || '外系班级',
    classGrade: '',
    courseName: courseById[e.courseId] || e.courseName || ('课程' + e.courseId),
    teacherName: teacherById[e.teacherId] || ('教师' + e.teacherId),
    roomName: e.classroomName || '未指定',
    roomType: '',
    combName: '', isExternal: true
  }));
}

function initData() {
  let sys = null;
  try {
    const json = readEmbeddedJson();
    if (json && !isEmptySys(json.system || json)) sys = json.system || json;
  } catch (e) {
    showToast('内置 JSON 解析失败：' + e.message, 5000);
    return;
  }
  if (!sys) { showToast('暂无数据：请把课表 JSON 粘贴到页面底部 <script id="kbData"> 标签内', 5000); return; }
  if (!Array.isArray(sys.teachers) || !Array.isArray(sys.classes) || !sys.schedule) {
    showToast('数据结构不符合要求：缺少 teachers / classes / schedule 字段', 5000);
    return;
  }

  DB = buildDBFromJson(sys);
  buildIndex();
  refreshHeroStats();
  DATA_READY = true;
  onTypeChange();

  /* ★ 记忆功能：从 hash / localStorage 恢复 */
  restoreState();
}

/* =========================================================================
   ★ 需求 3：记忆功能（hash + localStorage 双保险）
   ========================================================================= */
function saveState(q) {
  if (!q) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(q)); } catch (e) {}

  // 同时更新 URL hash（file:// 下也有效，可分享链接）
  let h = q.type;
  if (q.type === 'all') {
    h += (q.grade ? '/' + encodeURIComponent(q.grade) : '');
  } else if (q.type === 'free') {
    h += '/' + (q.slots || []).map(s => s.day + '-' + s.session).join(',');
  } else {
    h += '/' + q.id;
  }
  try { history.replaceState(null, '', '#' + h); } catch (e) {}
}

function loadState() {
  /* 优先 hash（用户手动改 hash 或分享链接时也能正确响应） */
  const h = location.hash.slice(1);
  if (h) {
    const parts = h.split('/');
    const type = parts[0];
    if (type === 'all') {
      return { type:'all', grade: decodeURIComponent(parts[1] || '') };
    }
    if (type === 'free') {
      const slots = (parts[1] || '').split(',').filter(Boolean).map(s => {
        const [d, se] = s.split('-').map(Number);
        return (d >= 1 && d <= 5 && se >= 1 && se <= 4) ? { day:d, session:se } : null;
      }).filter(Boolean);
      return slots.length ? { type:'free', slots } : null;
    }
    if (['teacher','class','classroom','course'].includes(type)) {
      const id = Number(parts[1]);
      if (id) return { type, id };
    }
  }
  /* 再从 localStorage */
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s && s.type) return s;
  } catch (e) {}
  return null;
}

function restoreState() {
  const saved = loadState();

  /* 无保存 → 默认全系总课表，静默 */
  if (!saved || !saved.type) {
    document.getElementById('qType').value = 'all';
    onTypeChange();
    doQuery(true);
    return;
  }

  const type = saved.type;

  /* free：先勾选时段 */
  if (type === 'free') {
    document.getElementById('qType').value = 'free';
    onTypeChange();
    (saved.slots || []).forEach(({ day, session }) => {
      const btn = document.querySelector(`#slotPicker [data-day="${day}"][data-session="${session}"]`);
      if (btn) btn.classList.add('active');
    });
    if ((saved.slots || []).length) {
      doQuery(true);
      showToast('已恢复上次查询：教师空闲查询');
    } else {
      showToast('上次查询为「教师空闲查询」，请选择时段');
    }
    return;
  }

  /* all */
  if (type === 'all') {
    document.getElementById('qType').value = 'all';
    onTypeChange();
    if (saved.grade) {
      const opt = document.querySelector(`#qTarget option[value="${saved.grade}"]`);
      if (opt) document.getElementById('qTarget').value = saved.grade;
    }
    doQuery(true);
    showToast('已恢复上次查询：' + (saved.grade || '全系') + '总课表');
    return;
  }

  /* teacher / class / classroom / course */
  if (!['teacher','class','classroom','course'].includes(type)) {
    document.getElementById('qType').value = 'all';
    onTypeChange();
    doQuery(true);
    return;
  }

  document.getElementById('qType').value = type;
  onTypeChange();

  const sel = document.getElementById('qTarget');
  if (saved.id != null && sel.querySelector(`option[value="${saved.id}"]`)) {
    sel.value = saved.id;
    doQuery(true);
    const name = ({
      teacher  : teacherById[saved.id],
      class    : classById[saved.id] && classById[saved.id].name,
      classroom: roomById[saved.id]  && roomById[saved.id].name,
      course   : courseById[saved.id]
    })[type] || ('#' + saved.id);
    const typeName = { teacher:'教师', class:'班级', classroom:'教室', course:'课程' }[type];
    showToast(`已恢复上次查询：按${typeName} - ${name}`);
    return;
  }

  /* 目标不存在（教师/班级被删等）→ 退回全系 */
  document.getElementById('qType').value = 'all';
  onTypeChange();
  doQuery(true);
}

   顶部统计 / 类型切换

function onTypeChange() {
  const type = document.getElementById('qType').value;
  const label = document.getElementById('targetLabel');
  const sel = document.getElementById('qTarget');
  const targetField = document.getElementById('targetField');
  const slotField = document.getElementById('slotField');
  const btnQuery = document.getElementById('btnQuery');

  sel.style.display = '';
  targetField.style.display = '';
  slotField.style.display = 'none';

  if (type === 'all') {
    label.textContent = '年级筛选';
    const grades = [...new Set((DB.classes || []).map(c => c[2]).filter(Boolean))]
      .sort((a,b)=>String(a).localeCompare(String(b),'zh-CN'));
    sel.innerHTML = '<option value="">全系（全部年级）</option>' +
      grades.map(g => `<option value="${g}">${g} 级</option>`).join('');
    btnQuery.textContent = '刷新总课表';
  } else if (type === 'free') {
    targetField.style.display = 'none';
    slotField.style.display = '';
    buildSlotPicker();
    btnQuery.textContent = '查询空闲';
  } else {
    const map = {
      teacher  : ['选择教师', (DB.teachers || []).filter(t => !t[2]).map(t => [t[0], t[1]])],
      class    : ['选择班级', (DB.classes || []).map(c => [c[0], c[1]])],
      classroom: ['选择教室', (DB.rooms  || []).map(r => [r[0], r[1]])],
      course   : ['选择课程', (DB.courses || []).map(c => [c[0], c[1]])]
    };
    const item = map[type];
    label.textContent = item[0];
    sel.innerHTML = '<option value="">-- 请选择 --</option>';
    item[1].forEach(([id, name]) => {
      const o = document.createElement('option');
      o.value = id; o.textContent = name;
      sel.appendChild(o);
    });
    btnQuery.textContent = '查询课表';
  }

  btnQuery.disabled = !DATA_READY;
}

function buildSlotPicker() {
  const picker = document.getElementById('slotPicker');
  if (picker.dataset.built) return;
  picker.dataset.built = '1';
  let html = '';
  DAY_LIST.forEach(d => {
    SESSION_LIST.forEach(s => {
      html += `<button type="button" class="slot-btn" data-day="${d}" data-session="${s}">${DAY_NAME[d]} ${SESSION_NAME[s]}</button>`;
    });
  });
  picker.innerHTML = html;
  picker.querySelectorAll('.slot-btn').forEach(b => {
    b.addEventListener('click', () => b.classList.toggle('active'));
  });
}

/* =========================================================================
   查询入口
   ========================================================================= */
function doQuery(silent) {
  if (!DATA_READY) { showToast('数据尚未加载完成'); return; }
  const type = document.getElementById('qType').value;
  let ok = true;

  if (type === 'free') {
    const slots = [...document.querySelectorAll('#slotPicker .slot-btn.active')]
      .map(b => ({ day:Number(b.dataset.day), session:Number(b.dataset.session) }));
    if (!slots.length) { showToast('请选择至少一个时段'); return; }
    currentQuery = { type:'free', slots };
    ok = renderFree(slots);
  } else {
    const raw = document.getElementById('qTarget').value;
    if (type !== 'all' && !raw) { showToast('请先选择要查询的对象'); return; }

    currentQuery = (type === 'all') ? { type:'all', grade: raw } : { type, id: Number(raw) };

    if (type === 'all')            ok = renderAll(raw);
    else if (type === 'teacher')   ok = renderTeacher(Number(raw));
    else if (type === 'class')     ok = renderClass(Number(raw));
    else if (type === 'classroom') ok = renderClassroom(Number(raw));
    else if (type === 'course')    ok = renderCourse(Number(raw));
  }

  if (!ok) {
    document.getElementById('resultPanel').classList.add('hidden');
    document.getElementById('btnExport').style.display = 'none';
    currentQuery = null;
    return;
  }
  document.getElementById('resultPanel').classList.remove('hidden');
  document.getElementById('btnExport').style.display = 'inline-block';

  /* ★ 保存到 hash + localStorage（silent 时也保存，保证状态一致） */
  saveState(currentQuery);
}

/* =========================================================================
   渲染工具
   ========================================================================= */
function dedupe(arr) {
  const seen = new Set();
  return arr.filter(e => {
    const k = e.courseId + '|' + e.teacherId + '|' + e.roomId;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
}
function groupBySlot(list) {
  const grid = {};
  list.forEach(e => {
    const k = e.day + '-' + e.session;
    (grid[k] = grid[k] || []).push(e);
  });
  Object.keys(grid).forEach(k => grid[k] = dedupe(grid[k]));
  return grid;
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function cardHTML(e, opts) {
  opts = opts || {};
  const cls = e.combName ? 'ccard combined' : 'ccard';
  const badge = e.combName ? '<span class="badge">合班</span>' : '';
  let meta = '';
  if (opts.showTeacher !== false && e.teacherName) meta += `<span class="cmeta">👨‍🏫 ${esc(e.teacherName)}</span>`;
  if (opts.showRoom !== false && e.roomName)       meta += `<span class="cmeta">📍 ${esc(e.roomName)}</span>`;
  if (e.combName)                        meta += `<span class="cmeta">👥 ${esc(e.combName)}</span>`;
  else if (opts.showClass && e.className) meta += `<span class="cmeta">🏫 ${esc(e.className)}</span>`;
  return `<div class="${cls}"><span class="cname">${esc(e.courseName)}${badge}</span>${meta}</div>`;
}

function gridTableHTML(list, opts) {
  const grid = groupBySlot(list);
  let html = '<div class="scroll-hint">← 左右滑动查看完整课表 →</div><div class="grid-scroll">';
  html += '<table class="grid-table"><thead><tr><th>节次</th>';
  DAY_LIST.forEach(d => html += `<th>${DAY_NAME[d]}</th>`);
  html += '</tr></thead><tbody>';
  SESSION_LIST.forEach(s => {
    html += `<tr><td>${SESSION_NAME[s]}</td>`;
    DAY_LIST.forEach(d => {
      const cell = grid[d + '-' + s] || [];
      html += '<td>';
      if (cell.length) cell.forEach(e => html += cardHTML(e, opts));
      else html += `<div class="cell-empty">${(opts && opts.emptyText) || '—'}</div>`;
      html += '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

/* =========================================================================
   各查询渲染
   ========================================================================= */
function renderAll(grade) {
  let clsList = (DB.classes || []).map(c => ({ id:c[0], name:c[1], grade:c[2] || '' }));
  if (grade) clsList = clsList.filter(c => String(c.grade) === String(grade));
  clsList.sort((a,b) => a.id - b.id);
  if (!clsList.length) { showToast('没有符合条件的班级'); return false; }

  const cellMap = {};
  entries.forEach(e => {
    const m = cellMap[e.classId] || (cellMap[e.classId] = {});
    const k = e.day + '-' + e.session;
    (m[k] = m[k] || []).push(e);
  });

  const gradeText = grade ? grade + '级' : '全系';
  document.getElementById('resultTitle').textContent = `【${gradeText}】总课表`;
  document.getElementById('resultSub').textContent =
    `${clsList.length} 个班级 · ${DAY_NAME[1]}~${DAY_NAME[5]} × 4 节次`;

  const totalCols = DAY_LIST.length * SESSION_LIST.length;
  const totalW = ALL_CLS_W + totalCols * ALL_COL_W;
  let html = '<div class="scroll-hint">← 左右滑动查看完整课表 →</div><div class="all-scroll">';
  html += `<table class="all-table" style="width:${totalW}px;table-layout:fixed">`;
  html += `<colgroup><col style="width:${ALL_CLS_W}px">`;
  for (let i = 0; i < totalCols; i++) html += `<col style="width:${ALL_COL_W}px">`;
  html += '</colgroup><thead><tr><th class="corner" rowspan="2">班级</th>';
  DAY_LIST.forEach(d => html += `<th colspan="${SESSION_LIST.length}">${DAY_NAME[d]}</th>`);
  html += '</tr><tr>';
  DAY_LIST.forEach(() => SESSION_LIST.forEach(s => html += `<th class="sub">${SESSION_NAME[s]}</th>`));
  html += '</tr></thead><tbody>';

  clsList.forEach(c => {
    html += `<tr><td class="cls-cell">${esc(c.name)}</td>`;
    DAY_LIST.forEach(d => SESSION_LIST.forEach(s => {
      const cell = (cellMap[c.id] && cellMap[c.id][d + '-' + s]) || [];
      html += '<td>';
      if (cell.length) {
        cell.forEach(e => {
          html += `<div class="mini${e.combName ? ' combined' : ''}">`;
          html += `<span class="cname">${esc(e.courseName)}</span>`;
          html += `<span class="cmeta">${esc(e.teacherName)}</span>`;
          html += `<span class="cmeta">${esc(e.roomName)}</span>`;
          html += '</div>';
        });
      } else html += '<div class="cell-empty">·</div>';
      html += '</td>';
    }));
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('resultBody').innerHTML = html;
  return true;
}

function renderTeacher(tid) {

  if (!list.length) { showToast('该教师暂无排课记录'); return false; }

  document.getElementById('resultSub').textContent =
    `${sessions.size} 节课 · ${new Set(list.map(e => e.courseId)).size} 门课 · 涉及 ${new Set(list.map(e => e.className)).size} 个班级`;

    gridTableHTML(list, { showTeacher:false, showRoom:true, showClass:true });

function renderClass(cid) {

  if (!list.length) { showToast('该班级暂无排课记录'); return false; }

  document.getElementById('resultSub').textContent =

function renderClassroom(rid) {
  const info = roomById[rid] || { name:'教室' + rid, type:'' };
  const list = entries.filter(e => e.roomId === rid);

function renderCourse(cid) {
  const name = courseById[cid] || ('课程' + cid);
  const list = entries.filter(e => e.courseId === cid);
  if (!list.length) { showToast('该课程暂无排课记录'); return false; }
  document.getElementById('resultTitle').textContent = `【${name}】授课情况`;
  document.getElementById('resultSub').textContent =
    `${new Set(list.map(e => e.teacherId)).size} 位教师 · ${new Set(list.map(e => e.classId)).size} 个班级 · ${list.length} 条排课`;

  Object.values(byTeacher).forEach(t => {

    t.items.forEach((e, i) => {

      html += `<td>${esc(e.className)}${e.combName ? ' <span style="font-size:10px;color:#b45309">（合班）</span>' : ''}</td>`;
      html += `<td>${DAY_NAME[e.day]}</td><td>${SESSION_NAME[e.session]}</td><td>${esc(e.roomName)}</td></tr>`;
    });
  });
  html += '</tbody></table>';
  document.getElementById('resultBody').innerHTML = html;
  return true;
}

/* =========================================================================
   ★ 需求 2：教师空闲查询（含"同时空闲"）
   ========================================================================= */
function renderFree(slots) {
  const all = entries.concat(externalEntries);
  const localTeachers = DB.teachers.filter(t => !t[2]); // 本系部教师

  /* 全局占用索引：day-session-teacherId → [entries] */
  const occ = new Map();
  all.forEach(e => {
    const k = `${e.day}-${e.session}-${e.teacherId}`;
    if (!occ.has(k)) occ.set(k, []);
    occ.get(k).push(e);
  });
  const isBusy = (day, session, tid) => occ.has(`${day}-${session}-${tid}`);
  const busyInfo = (day, session, tid) => occ.get(`${day}-${session}-${tid}`) || [];

  const nameChip = (name, extra, isBusyStyle) => {
    let s = `<span class="free-name${isBusyStyle ? ' busy' : ''}">${esc(name)}`;
    if (extra) s += `<span class="free-extra">[${esc(extra)}]</span>`;
    return s + '</span>';
  };

  let html = '';

  /* 各时段单独卡片 */
  slots.forEach(({ day, session }) => {
    const freeList = localTeachers.filter(t => !isBusy(day, session, t[0]));
    const busyList = localTeachers.filter(t =>  isBusy(day, session, t[0]));

    html += `<div class="free-card">`;
    html += `<div class="free-head">
               <span>【${DAY_NAME[day]} ${SESSION_NAME[session]}】</span>
               <span class="badge">空闲 ${freeList.length} / 有课 ${busyList.length}</span>
             </div>`;
    html += `<div class="free-sec"><span class="free-label">空闲：</span><span class="free-names">`;
    html += freeList.length ? freeList.map(t => nameChip(t[1])).join('') : '（无）';
    html += `</span></div>`;
    html += `<div class="free-sec"><span class="busy-label">有课：</span><span class="free-names">`;
    html += busyList.length
      ? busyList.map(t => {
          const info = busyInfo(day, session, t[0]).map(e =>
            `${e.courseName}(${e.className})`).join('、');
          return nameChip(t[1], info, true);
        }).join('')
      : '（无）';
    html += `</span></div></div>`;
  });

  /* ★ 同时空闲（选了 ≥2 个时段才显示） */
  if (slots.length > 1) {
    const commonFree = localTeachers.filter(t =>
      slots.every(({ day, session }) => !isBusy(day, session, t[0]))
    );
    const slotText = slots.map(s => `${DAY_NAME[s.day]} ${SESSION_NAME[s.session]}`).join(' · ');

    html += `<div class="free-card common">`;
    html += `<div class="free-head">
               <span>⭐ 所选 ${slots.length} 个时段【同时空闲】</span>
               <span class="badge">${commonFree.length} 人</span>
             </div>`;
    html += `<div class="free-sec" style="color:#065f46;margin-top:2px;">`;
    html += `<span style="font-size:11.5px;color:#059669;">${slotText}</span>`;
    html += `</div>`;
    html += `<div class="free-sec"><span class="free-names">`;
    html += commonFree.length
      ? commonFree.map(t => nameChip(t[1])).join('')
      : '（无教师同时空闲）';
    html += `</span></div></div>`;
  }

  document.getElementById('resultTitle').textContent = '教师空闲查询';
  document.getElementById('resultSub').textContent =
    `已选 ${slots.length} 个时段 · 本系部 ${localTeachers.length} 位教师`;
  document.getElementById('resultBody').innerHTML = html;
  return true;
}

/* =========================================================================
   导出 Excel
   ========================================================================= */
const EXPORT_CSS = `
<style>
  table { border-collapse:collapse; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  th,td { border:1px solid #94a3b8; padding:5px 6px; font-size:10pt; vertical-align:top; }
  th { background:#1e293b; color:#fff; text-align:center; font-weight:bold; }
  th.corner { background:#0f172a; }
  td.session { background:#f1f5f9; text-align:center; font-weight:bold; color:#475569; }
  td.free { text-align:center; color:#cbd5e1; }
  td.busy { background:#eff6ff; }
  div.course { margin:0 0 6px 0; }
  div.course:last-child { margin-bottom:0; }
  span.cname { font-weight:bold; color:#1e3a8a; font-size:10pt; }
  span.cmeta { color:#475569; font-size:9pt; }
  div.combined span.cname { color:#92400e; }
</style>`;

function buildGridExportHtml(list, opts) {
  const grid = groupBySlot(list);
  const empty = opts.emptyText || '—';
  let h = EXPORT_CSS + '<table><colgroup><col width="72">';
  for (let i = 0; i < 5; i++) h += '<col width="155">';
  h += '</colgroup><tr><th class="corner">节次</th>';
  DAY_LIST.forEach(d => h += `<th>${DAY_NAME[d]}</th>`);
  h += '</tr>';
  SESSION_LIST.forEach(s => {
    h += `<tr><td class="session">${SESSION_NAME[s]}</td>`;
    DAY_LIST.forEach(d => {
      const cell = grid[d + '-' + s] || [];
      if (cell.length) {
        h += '<td class="busy">';
        cell.forEach(e => {
          const metas = [];
          if (opts.showTeacher) metas.push('👨‍🏫 ' + e.teacherName);
          if (opts.showRoom)    metas.push('📍 ' + e.roomName);
          if (e.combName)       metas.push('👥 ' + e.combName);
          else if (opts.showClass) metas.push('🏫 ' + e.className);
          h += `<div class="course${e.combName ? ' combined' : ''}">`;
          h += `<span class="cname">${esc(e.courseName)}${e.combName ? '（合班）' : ''}</span><br>`;
          if (metas.length) h += `<span class="cmeta">${esc(metas.join(' ｜ '))}</span>`;
          h += '</div>';
        });
        h += '</td>';
      } else h += `<td class="free">${esc(empty)}</td>`;
    });
    h += '</tr>';
  });
  return h + '</table>';
}

function buildAllExportHtml(grade) {
  let clsList = (DB.classes || []).map(c => ({ id:c[0], name:c[1], grade:c[2] || '' }));
  if (grade) clsList = clsList.filter(c => String(c.grade) === String(grade));
  clsList.sort((a,b) => a.id - b.id);
  const cellMap = {};
  entries.forEach(e => {
    const m = cellMap[e.classId] || (cellMap[e.classId] = {});
    const k = e.day + '-' + e.session;
    (m[k] = m[k] || []).push(e);
  });
  let h = EXPORT_CSS + '<table><colgroup><col width="90">';
  for (let i = 0; i < DAY_LIST.length * SESSION_LIST.length; i++) h += '<col width="120">';
  h += '</colgroup><tr><th class="corner" rowspan="2">班级</th>';
  DAY_LIST.forEach(d => h += `<th colspan="${SESSION_LIST.length}">${DAY_NAME[d]}</th>`);
  h += '</tr><tr>';
  DAY_LIST.forEach(() => SESSION_LIST.forEach(s => h += `<th>${SESSION_NAME[s]}</th>`));
  h += '</tr>';
  clsList.forEach(c => {
    h += `<tr><td class="session">${esc(c.name)}</td>`;
    DAY_LIST.forEach(d => SESSION_LIST.forEach(s => {
      const cell = (cellMap[c.id] && cellMap[c.id][d + '-' + s]) || [];
      if (cell.length) {
        h += '<td class="busy">';
        cell.forEach(e => {
          h += `<div class="course${e.combName ? ' combined' : ''}">`;
          h += `<span class="cname">${esc(e.courseName)}</span><br>`;
          h += `<span class="cmeta">${esc(e.teacherName)} ｜ ${esc(e.roomName)}</span></div>`;
        });
        h += '</td>';
      } else h += '<td class="free">—</td>';
    }));
    h += '</tr>';
  });
  return h + '</table>';
}

function buildListExportHtml(list) {
  const byT = {};
  list.forEach(e => (byT[e.teacherId] = byT[e.teacherId] || { name:e.teacherName, items:[] }).items.push(e));
  let h = EXPORT_CSS + '<table><colgroup><col width="110"><col width="160"><col width="70"><col width="85"><col width="130"></colgroup>';
  h += '<tr><th>任课教师</th><th>班级</th><th>星期</th><th>节次</th><th>教室</th></tr>';
  Object.values(byT).forEach(t => {
    t.items.sort((a,b) => a.className.localeCompare(b.className,'zh-CN') || a.day - b.day || a.session - b.session);
    t.items.forEach((e, i) => {
      h += '<tr>';
      if (i === 0) h += `<td rowspan="${t.items.length}" style="font-weight:bold;color:#1e3a8a;background:#f8fafc;text-align:center;vertical-align:middle">${esc(t.name)}</td>`;
      h += `<td>${esc(e.className)}${e.combName ? '（合班）' : ''}</td>`;
      h += `<td style="text-align:center">${DAY_NAME[e.day]}</td>`;
      h += `<td style="text-align:center">${SESSION_NAME[e.session]}</td>`;
      h += `<td>${esc(e.roomName)}</td></tr>`;
    });
  });
  return h + '</table>';
}

/* ★ 空闲导出：含"同时空闲" */
function buildFreeExportHtml(slots) {
  const all = entries.concat(externalEntries);
  const localTeachers = DB.teachers.filter(t => !t[2]);
  const occ = new Map();
  all.forEach(e => {
    const k = `${e.day}-${e.session}-${e.teacherId}`;
    if (!occ.has(k)) occ.set(k, []);
    occ.get(k).push(e);
  });

  let h = EXPORT_CSS + '<table><colgroup><col width="130"><col width="60"><col width="100"><col width="320"></colgroup>';
  h += '<tr><th>时段</th><th>状态</th><th>教师</th><th>课程（班级）</th></tr>';

  slots.forEach(({ day, session }) => {
    const slotText = `${DAY_NAME[day]} ${SESSION_NAME[session]}`;
    localTeachers.filter(t => !occ.has(`${day}-${session}-${t[0]}`)).forEach(t => {
      h += `<tr><td>${slotText}</td><td style="text-align:center;color:#059669">空闲</td><td>${esc(t[1])}</td><td></td></tr>`;
    });
    localTeachers.filter(t => occ.has(`${day}-${session}-${t[0]}`)).forEach(t => {
      const info = (occ.get(`${day}-${session}-${t[0]}`) || [])
        .map(e => `${e.courseName}(${e.className})`).join('、');
      h += `<tr><td>${slotText}</td><td style="text-align:center;color:#b91c1c">有课</td><td>${esc(t[1])}</td><td>${esc(info)}</td></tr>`;
    });
  });

  if (slots.length > 1) {
    const commonFree = localTeachers.filter(t =>
      slots.every(({ day, session }) => !occ.has(`${day}-${session}-${t[0]}`))
    );
    const slotText = slots.map(s => `${DAY_NAME[s.day]} ${SESSION_NAME[s.session]}`).join(' · ');
    h += `<tr><td colspan="4" style="background:#ecfdf5;font-weight:bold;color:#065f46;">⭐ 同时空闲（${slotText}）：${commonFree.length} 人</td></tr>`;
    h += `<tr><td colspan="4" style="background:#ecfdf5;">${esc(commonFree.map(t => t[1]).join('、') || '（无）')}</td></tr>`;
  }

  return h + '</table>';
}

function downloadHtmlAsXls(html, fileName) {
  const full = `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8">
    <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
    <x:Name>课表</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
    </x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
    </head><body>${html}</body></html>`;
  const blob = new Blob(['\ufeff' + full], { type:'application/vnd.ms-excel;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function exportExcel() {
  if (!currentQuery) return;
  const { type, id, grade, slots } = currentQuery;
  let html = '', fileName = '';

  if (type === 'all') {
    html = buildAllExportHtml(grade || '');
    fileName = (grade ? grade + '级' : '全系') + '总课表.xls';
  } else if (type === 'teacher') {
    const name = teacherById[id] || ('教师' + id);
    html = buildGridExportHtml(entries.concat(externalEntries).filter(e => e.teacherId === id),
                               { showTeacher:false, showRoom:true, showClass:true });
    fileName = `${name}_课表.xls`;
  } else if (type === 'class') {
    const info = classById[id] || { name:'班级' + id };
    html = buildGridExportHtml(entries.filter(e => e.classId === id),
                               { showTeacher:true, showRoom:true, showClass:false });
    fileName = `${info.name}_课表.xls`;
  } else if (type === 'classroom') {
    const info = roomById[id] || { name:'教室' + id };
    html = buildGridExportHtml(entries.filter(e => e.roomId === id),
                               { showTeacher:true, showRoom:false, showClass:true, emptyText:'空闲' });
    fileName = `${info.name}_占用情况.xls`;
  } else if (type === 'course') {
    const name = courseById[id] || ('课程' + id);
    html = buildListExportHtml(entries.filter(e => e.courseId === id));
    fileName = `${name}_授课情况.xls`;
  } else if (type === 'free') {
    html = buildFreeExportHtml(slots || []);
    fileName = '教师空闲查询.xls';
  }

  downloadHtmlAsXls(html, fileName);
  showToast(`已导出：${fileName}`);
}

(function init() {
  DB = { teachers:[], courses:[], classes:[], rooms:[], combined:[], schedule:[], external:[] };
  buildIndex();
  onTypeChange();
  refreshHeroStats();
  initData();
})();
