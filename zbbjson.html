<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>值班表 · 数据生成</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --brand:#2b5cff; --brand-d:#1e40c4; --bg:#f5f7fb;
  --line:#e8ebf3; --txt:#1e2430; --muted:#7d879c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 60px;}
h1{font-size:18px;margin:0 0 5px;font-weight:600;}
.lead{color:var(--muted);font-size:13px;margin:0 0 18px;}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;
      box-shadow:0 1px 3px rgba(20,30,60,.06);}
.card h2{font-size:14px;margin:0 0 12px;font-weight:600;color:#2c3446;}
.drop{
  border:2px dashed #ccd4e6;border-radius:12px;padding:26px 16px;
  text-align:center;background:#fafbff;cursor:pointer;transition:.16s;
}
.drop.over{border-color:var(--brand);background:#eef3ff;}
.drop p{margin:0 0 12px;font-size:13.5px;color:var(--muted);}
.btn{
  border:0;border-radius:9px;padding:9px 16px;font:inherit;font-size:13.5px;
  cursor:pointer;background:var(--brand);color:#fff;transition:.15s;
}
.btn:hover{background:var(--brand-d);}
.btn.ghost{background:#eef2ff;color:var(--brand-d);}
.btn.ghost:hover{background:#e2e9ff;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
.muted{color:var(--muted);font-size:12.5px;}
.grow{flex:1;}
textarea{
  width:100%;height:460px;border:1px solid var(--line);border-radius:10px;padding:14px;
  font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;resize:vertical;
  background:#fbfcff;color:#334;outline:none;white-space:pre;
}
textarea:focus{border-color:var(--brand);}
.pv{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
th{background:#f7f9ff;color:#5b657a;font-size:12.5px;position:sticky;top:0;z-index:1;}
code{background:#eef1f8;border-radius:4px;padding:1px 5px;font-size:12px;
     font-family:ui-monospace,Menlo,Consolas,monospace;}
#toast{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,16px);
  background:rgba(28,34,48,.92);color:#fff;padding:9px 18px;border-radius:9px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:99;
}
#toast.show{opacity:1;transform:translate(-50%,0);}
@media (max-width:520px){
  .wrap{padding:16px 12px 50px;}
  h1{font-size:16.5px;}
  .card{padding:14px;}
  textarea{height:340px;font-size:12px;}
  .btn{padding:8px 13px;font-size:13px;}
}
</style>
</head>
<body>

<div class="wrap">
  <h1>值班表 · 数据生成</h1>
  <p class="lead">导入 Excel，生成 zbcx.html 可直接引用的 duty-data.js</p>

  <section class="card">
    <div class="drop" id="drop">
      <p>拖入 Excel 值班表，或点击选择文件</p>
      <button class="btn" type="button" id="btnPick">选择 Excel 文件</button>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    </div>
    <p class="muted" style="margin:12px 0 0">
      支持 .xlsx / .xls / .csv；需含「日期 / 星期 / 值班人」表头，姓名与手机号放在同一单元格（换行分隔）会自动拆分。
      每次导入会替换当前数据。
    </p>
  </section>

  <section class="card" id="cardPreview" hidden>
    <h2>数据预览</h2>
    <div class="pv">
      <table>
        <thead><tr><th>日期</th><th>星期</th><th>值班人</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section class="card" id="cardOut" hidden>
    <h2>生成 duty-data.js</h2>
    <div class="row">
      <span class="muted grow" id="size"></span>
      <button class="btn ghost" id="btnCopy">复制内容</button>
      <button class="btn" id="btnDownload">下载 duty-data.js</button>
    </div>
    <textarea id="out" readonly spellcheck="false"></textarea>
    <p class="muted" style="margin:12px 0 0">
      把下载的 <code>duty-data.js</code> 与 <code>zbcx.html</code> 放在同一目录即可。
      备注和标题已固定在 <code>zbcx.html</code> 中，无需在此填写。
    </p>
  </section>
</div>

<div id="toast"></div>

<script>
/* ===================== 工具 ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function copyText(text){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy') ? resolve() : reject(new Error('copy failed')); }
    catch(e){ reject(e); }
    document.body.removeChild(ta);
  });
}

function download(filename, text, mime){
  const blob = new Blob([text], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ===================== 状态 ===================== */
const state = { months: [], out: '' };

/* ===================== 解析 ===================== */
function parsePerson(raw){
  let s = String(raw).replace(/\s+/g, ' ').trim();
  if (!s) return null;
  const m = s.match(/1[3-9]\d{9}/);
  if (m){
    const name = (s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length))
                   .replace(/[^\u4e00-\u9fa5A-Za-z·]/g, '');
    return [name || '未填写', m[0]];
  }
  const name = s.replace(/[^\u4e00-\u9fa5A-Za-z·]/g, '');
  return [name || s, ''];
}

function splitPeople(raw){
  return String(raw)
    .split(/\r?\n|<br\s*\/?>|、|；|;/i)
    .map(x => x.trim())
    .filter(Boolean)
    .map(parsePerson)
    .filter(Boolean);
}

function aoaToMonths(rows){
  const clean = (rows || []).map(r =>
    (r || []).map(c => String(c ?? '').replace(/\r/g, '').trim()));

  let hIdx = clean.findIndex(r => r.some(c => c.includes('日期')));
  if (hIdx < 0) hIdx = clean.findIndex(r => r.some(c => c.includes('值班')));
  if (hIdx < 0) throw new Error('没有找到表头（需包含"日期""值班人"等列）');

  const hdr = clean[hIdx];
  const idxOf = (...keys) => hdr.findIndex(c => keys.some(k => c.includes(k)));

  const ci = {
    date:   Math.max(idxOf('日期'), 0),
    week:   idxOf('星期', '周'),
    people: hdr.findIndex(c => c.includes('值班') && !c.includes('日期')),
  };
  if (ci.week < 0)   ci.week   = ci.date + 1;
  if (ci.people < 0) ci.people = ci.date + 2;
  if (ci.people === ci.date) ci.people = ci.date + 2;

  /* 年份：从标题行提取 */
  let year = new Date().getFullYear();
  for (let i = 0; i < hIdx; i++){
    const t = clean[i].filter(Boolean).join(' ');
    const ym = t.match(/(20\d{2})\s*年/);
    if (ym){ year = +ym[1]; break; }
  }

  /* 按月份分组 */
  const map = new Map();  // 月份 → { y, m, ds: [] }

  for (let i = hIdx + 1; i < clean.length; i++){
    const r = clean[i];
    if (!r.length) continue;
    const all = r.filter(Boolean).join(' ').trim();
    if (!all) continue;

    const first = r[ci.date] || '';
    if (first.includes('备注') || all.startsWith('备注')) break;

    const dm = first.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
    if (!dm) continue;

    const mo = +dm[1], da = +dm[2];
    const week = (r[ci.week] || '').replace(/^星期/, '').replace(/^周/, '').trim();
    const people = splitPeople(r[ci.people] || '');
    if (!people.length) continue;

    if (!map.has(mo)) map.set(mo, { y: year, m: mo, ds: [] });
    map.get(mo).ds.push([da, week, people]);
  }

  if (!map.size) throw new Error('没有解析到任何值班数据，请检查表格格式');

  const months = Array.from(map.values());
  months.sort((a, b) => (a.y - b.y) || (a.m - b.m));
  months.forEach(mo => mo.ds.sort((a, b) => a[0] - b[0]));

  return months;
}

function parseExcel(buf){
  if (typeof XLSX === 'undefined')
    throw new Error('Excel 解析库未加载，请联网后刷新页面再试');

  const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });

  let aoa = null;
  for (const name of wb.SheetNames){
    const tmp = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' });
    if (tmp.some(r => (r || []).some(c => String(c ?? '').includes('日期')))){ aoa = tmp; break; }
  }
  if (!aoa){
    const name = wb.SheetNames[0];
    aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' });
  }
  return aoaToMonths(aoa);
}

/* ===================== 生成 duty-data.js（与手工排版一致） ===================== */
function fmtStr(s){
  return JSON.stringify(String(s));
}

function formatMonth(mo, isLast){
  const lines = [];
  lines.push(`    /* ==================== ${mo.y}年${mo.m}月 ==================== */`);
  lines.push(`    {`);
  lines.push(`      y: ${mo.y},`);
  lines.push(`      m: ${mo.m},`);
  lines.push(`      ds: [`);

  mo.ds.forEach(([da, wk, ppl], i) => {
    const pplStr = ppl.map(([n, p]) => `[${fmtStr(n)},${fmtStr(p)}]`).join(',');
    const comma  = i < mo.ds.length - 1 ? ',' : '';
    const daStr  = String(da);
    /* 日号 1 位时多补一个空格，与两位数对齐 */
    const pad    = daStr.length < 2 ? '  ' : ' ';
    lines.push(`        [${daStr},${pad}${fmtStr(wk)}, [${pplStr}]]${comma}`);
  });

  lines.push(`      ]`);
  lines.push(`    }${isLast ? '' : ','}`);
  return lines.join('\n');
}

function buildDutyJs(months){
  const blocks = months.map((mo, i) => formatMonth(mo, i === months.length - 1));
  return (
    `/* 值班数据 —— 由值班表生成工具导出\n` +
    ` * 共 ${months.length} 个月份，直接保存即可，zbcx.html 会自动读取\n` +
    ` */\n` +
    `window.DUTY_DATA = {\n` +
    `  months: [\n\n` +
    blocks.join('\n\n') +
    `\n\n  ]\n` +
    `};\n`
  );
}

/* ===================== 文件交互 ===================== */
const drop = $('#drop');
const fileInput = $('#file');

$('#btnPick').addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) handleFile(f);
  e.target.value = '';
});

['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f);
});

function handleFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const months = parseExcel(fr.result);
      state.months = months;               // 直接替换，不累积
      render();
      toast('已解析 ' + months.map(m => m.y + '年' + m.m + '月').join('、'));
    }catch(err){
      alert('解析失败：' + err.message);
    }
  };
  fr.onerror = () => alert('文件读取失败');
  fr.readAsArrayBuffer(file);
}

/* ===================== 渲染 ===================== */
function render(){
  const { months } = state;

  if (!months.length){
    $('#cardPreview').hidden = true;
    $('#cardOut').hidden = true;
    return;
  }

  /* 表格预览 */
  $('#cardPreview').hidden = false;
  const rows = [];
  months.forEach(mo => {
    mo.ds.forEach(([da, wk, ppl]) => {
      rows.push(`<tr>
        <td>${mo.m}/${String(da).padStart(2, '0')}</td>
        <td>周${esc(wk)}</td>
        <td>${ppl.map(p =>
          `<span style="font-weight:600">${esc(p[0])}</span>
           <span class="muted">${esc(p[1])}</span>`).join('<br>')}</td>
      </tr>`);
    });
  });
  $('#tbody').innerHTML = rows.join('');

  /* 生成与 duty-data.js 排版一致的文本 */
  state.out = buildDutyJs(months);
  $('#cardOut').hidden = false;
  $('#out').value = state.out;

  const totalDays = months.reduce((s, m) => s + m.ds.length, 0);
  const bytes = new Blob([state.out]).size;
  $('#size').textContent = `${months.length} 个月 · 共 ${totalDays} 天 · ${bytes} 字节`;
}

/* 复制完整内容 */
$('#btnCopy').addEventListener('click', () => {
  if (!state.out) return;
  copyText(state.out)
    .then(() => toast('已复制 duty-data.js 内容'))
    .catch(() => toast('复制失败，请手动全选复制'));
});

/* 下载 duty-data.js */
$('#btnDownload').addEventListener('click', () => {
  if (!state.out) return;
  download('duty-data.js', state.out, 'text/javascript;charset=utf-8');
  toast('已下载 duty-data.js');
});
</script>
</body>
</html>
