        /* =========================================================
           一、通用工具
           ========================================================= */

        function hashString(str) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619) >>> 0;
            }
            return h >>> 0;
        }

        function createRng(seed) {
            let s = (seed >>> 0) || 0x9e3779b9;
            return function () {
                s ^= (s << 13); s >>>= 0;
                s ^= (s >>> 17);
                s ^= (s << 5); s >>>= 0;
                return s / 4294967296;
            };
        }

        function pick(rng, arr) {
            if (!arr || arr.length === 0) return '';
            return arr[Math.floor(rng() * arr.length)];
        }

        function fmt(v, digits) {
            digits = (digits === undefined) ? 2 : digits;
            const num = Number(v);
            if (!isFinite(num)) return (0).toFixed(digits);
            return num.toFixed(digits);
        }

        /* =========================================================
           二、统计维度计算
           ========================================================= */

        function getLevel(mean) {
            if (mean >= 90) return { key: 'excellent', label: '优秀' };
            if (mean >= 80) return { key: 'good', label: '良好' };
            if (mean >= 70) return { key: 'medium', label: '中等' };
            if (mean >= 60) return { key: 'pass', label: '及格边缘' };
            return { key: 'poor', label: '未达及格线' };
        }

        function getDispersion(std, n) {
            if (n < 3) return { key: 'insufficient', label: '样本过少' };
            if (std < 8) return { key: 'veryConcentrated', label: '高度集中' };
            if (std < 12) return { key: 'concentrated', label: '较为集中' };
            if (std < 16) return { key: 'moderate', label: '分布适中' };
            if (std < 20) return { key: 'scattered', label: '较为分散' };
            return { key: 'veryScattered', label: '分化明显' };
        }

        function computeDimensions(scores) {
            const n = scores.length;
            const sorted = [...scores].sort((a, b) => a - b);
            const sum = scores.reduce((a, b) => a + b, 0);
            const mean = sum / n;
            const max = sorted[n - 1];
            const min = sorted[0];

            const variance = scores.reduce((a, s) => a + Math.pow(s - mean, 2), 0) / n;
            const std = Math.sqrt(variance);
            const mad = scores.reduce((a, s) => a + Math.abs(s - mean), 0) / n;

            const counts = { fail: 0, d60: 0, d70: 0, d80: 0, d90: 0 };
            scores.forEach(s => {
                if (s < 60) counts.fail++;
                else if (s < 70) counts.d60++;
                else if (s < 80) counts.d70++;
                else if (s < 90) counts.d80++;
                else counts.d90++;
            });

            const passCount = n - counts.fail;
            const passRate = (passCount / n) * 100;
            const excellentRate = (counts.d90 / n) * 100;
            const failRate = (counts.fail / n) * 100;

            return {
                n, sorted, sum, mean, max, min,
                range: max - min,
                variance, std, mad,
                counts, passCount, passRate, excellentRate, failRate,
                level: getLevel(mean),
                dispersion: getDispersion(std, n)
            };
        }

        /* ---------- 4. 极值分析 ---------- */
        function buildExtremes(d, rng) {
            if (d.n === 1) {
                return `本次只有 1 条有效成绩，分数为 ${d.max} 分。`;
            }

            const fullCount = d.sorted.filter(s => s === 100).length;

            const openers = [
                `最高分 ${d.max} 分，最低分 ${d.min} 分，极差 ${d.range} 分。`,
                `本次成绩最高 ${d.max} 分、最低 ${d.min} 分，分差为 ${d.range} 分。`,
                `分数极值为：最高 ${d.max} 分、最低 ${d.min} 分，两者相差 ${d.range} 分。`,
                `全班最高分 ${d.max} 分，最低分 ${d.min} 分，跨度 ${d.range} 分。`
            ];

            const parts = [pick(rng, openers)];

            if (fullCount > 0) {
                parts.push(`其中 ${fullCount} 人取得满分。`);
            } else if (d.max >= 95) {
                parts.push('最高分已接近满分。');
            }

            if (d.range <= 10) {
                parts.push('全班分数咬得很紧，没有出现明显掉队的同学。');
            } else if (d.range <= 20) {
                parts.push('分差控制在合理范围内。');
            } else if (d.range <= 35) {
                parts.push('高低分之间已经拉开一定距离。');
            } else {
                parts.push('最高分与最低分之间落差较大，低分同学的学习状况需要重点关注。');
            }

            return parts.join('');
        }

        /* ---------- 5. 分数段结构 ---------- */
        function buildStructure(d, rng) {
            if (d.n < 3) {
                return `本次有效成绩只有 ${d.n} 条，分数段结构暂不做分析。`;
            }

            const parts = [];
            const excRate = (d.counts.d90 / d.n) * 100;
            const mid = d.counts.d60 + d.counts.d70 + d.counts.d80;
            const midRate = (mid / d.n) * 100;
            const failRate = (d.counts.fail / d.n) * 100;

            const excOpeners = [
                () => `90 分以上 ${d.counts.d90} 人，占 ${fmt(excRate, 1)}%，高分段已经形成一定规模。`,
                () => `优秀段（90-100 分）共 ${d.counts.d90} 人，占比 ${fmt(excRate, 1)}%，高分群体较为可观。`,
                () => `达到 90 分的同学有 ${d.counts.d90} 人，占比 ${fmt(excRate, 1)}%，高分段基础不错。`
            ];
            const excLow = [
                () => `90 分以上仅 ${d.counts.d90} 人，占 ${fmt(excRate, 1)}%，高分段还比较薄弱。`,
                () => `优秀段（90-100 分）只有 ${d.counts.d90} 人，占比 ${fmt(excRate, 1)}%，拔尖力量不足。`,
                () => `达到 90 分的同学仅 ${d.counts.d90} 人，占比 ${fmt(excRate, 1)}%，高分段有待加强。`
            ];

            if (d.counts.d90 === 0) {
                parts.push('本次考试无人达到 90 分，高分段仍为空白。');
            } else if (excRate >= 30) {
                parts.push(excOpeners[0]());
            } else if (excRate >= 15) {
                parts.push(excOpeners[1]());
            } else {
                parts.push(pick(rng, excLow)());
            }

            const midTemplates = [
                `60-89 分区间共 ${mid} 人，占 ${fmt(midRate, 1)}%${midRate >= 60 ? '，是班级的主体部分。' : '。'}`,
                `中间段（60-89 分）共 ${mid} 人，占比 ${fmt(midRate, 1)}%${midRate >= 60 ? '，构成了班级的中坚力量。' : '，中间层还不够厚实。'}`,
                `及格至良好区间（60-89 分）有 ${mid} 人，占比 ${fmt(midRate, 1)}%。`
            ];
            parts.push(pick(rng, midTemplates));

            if (d.counts.fail === 0) {
                if (d.mean < 70) {
                    parts.push('虽然没有同学不及格，但整体分数偏低，多数人是在及格线上勉强过关。');
                } else {
                    parts.push('没有同学不及格。');
                }
            } else if (failRate >= 25) {
                parts.push(`不及格 ${d.counts.fail} 人，占 ${fmt(failRate, 1)}%，比例偏高，需要重点干预。`);
            } else if (failRate >= 10) {
                parts.push(`不及格 ${d.counts.fail} 人，占 ${fmt(failRate, 1)}%，这部分同学的补差任务要落实到位。`);
            } else {
                parts.push(`不及格 ${d.counts.fail} 人，占 ${fmt(failRate, 1)}%，属于个别情况。`);
            }

            return parts.join('');
        }

        /* ---------- 6. 教学建议 ---------- */
        const suggestionPools = {
            highUniform: [
                '整体水平高且整齐，可以适当增加拓展性、挑战性内容，进一步拉高上限。',
                '班级起点较高，建议在巩固的基础上适当加快节奏，补充一些综合性、开放性的题目。',
                '整体掌握扎实，可以把课堂重心从“讲懂”转向“讲透”，多做变式训练。',
                '全班水平整齐且偏高，适合整体提速，可尝试项目式或专题式教学。',
                '基础已经非常稳固，建议把精力放在思维深度和解题灵活性上。',
                '学生接受能力强且步调一致，可以适当引入跨章节的综合题型。',
                '水平整齐是优势，建议利用这一点开展限时训练，重点提升解题速度与规范度。',
                '班级整体水平较高，建议适当减少重复训练，把时间投向思维拓展和综合应用。',
                '整体表现优异且稳定，可以尝试让学生主导讲评，以讲促思。'
            ],
            highDiff: [
                '整体水平较高，但个体差异明显，建议在保持整体进度的同时，为学有余力的同学单独安排拓展任务。',
                '班级里已有明显的强弱分层，建议以小组为单位开展互助学习，让优秀学生带动中段同学。',
                '高分段有基础但不够整齐，建议分层布置作业，让不同起点的同学都有明确的提升目标。',
                '成绩整体不错但拉开了差距，建议对后段同学做一次知识点排查，防止差距继续扩大。',
                '建议采用“基础统一+拓展分层”的双轨模式，既保底又不限制上限。',
                '高分层和中间层的需求差异较大，建议在讲评课上设置不同难度的思考题。',
                '整体水平高但参差，建议把课堂提问分层设计，让不同层次的学生都有参与感。',
                '分化出现在较高水平区间，建议通过专题小灶的方式，给后段同学补上关键短板。',
                '建议对高分段学生布置研究性任务，对后段学生则强化基础题型的反复过关。'
            ],
            midUniform: [
                '整体处于中等水平且比较整齐，说明基础部分问题不大，下一步重点是突破中高难度题型。',
                '班级水平均衡，适合整体推进，建议讲评时多总结通性通法，帮助学生形成解题思路。',
                '中段学生集中，提升空间最大，建议针对高频失分点做专题训练。',
                '水平整齐是优势，建议利用这一点开展同伴互评，提高学生的自我纠错能力。',
                '基础掌握比较均衡，建议把课堂重点从“会不会”转向“快不快、准不准”。',
                '整体水平稳定，建议通过限时训练提高解题速度和准确率。',
                '中段集中意味着可塑性最强，建议每节课安排一个“必得分点”小专题。',
                '班级整齐度高，适合整体提速，建议适当压缩基础题讲解，增加综合题训练。',
                '整体水平均衡，建议在讲评中多对比不同解法，拓宽学生的思路。'
            ],
            midDiff: [
                '整体处于中等水平，但内部差异较大，建议分层教学，避免快的吃不饱、慢的跟不上。',
                '班级分化已经显现，建议把作业分成基础题和提升题两部分，让每位同学都能完成基本任务。',
                '中段生与后进生差距明显，建议先对后进生做知识点排查，再安排针对性辅导。',
                '分层比较明显，建议在课堂上设置“必做”和“选做”两个层级，兼顾不同学生。',
                '分化已经形成，建议利用小组合作的方式，让中段学生带动后段学生。',
                '班级内部差异较大，建议对后段学生先做一次专项诊断，明确薄弱知识点。',
                '中等水平但参差不齐，建议用“同一知识点、不同难度”的题组来兼顾两端。',
                '建议每周安排一次分层小测，让不同层次的学生都能看到自己的进步。',
                '班级分化在中等水平段，建议对后段学生减少题量、提高重复度，先稳住基础分。'
            ],
            lowPass: [
                '整体刚过及格线，建议放慢节奏，把核心基础知识重新梳理一遍，确保人人过关。',
                '多数同学停留在及格线附近，说明基础题能拿分但不够稳，建议加强基础题型的反复训练。',
                '整体基础不牢，建议先做减法——减少难题比重，把时间和精力集中在必考基础点上。',
                '及格率虽然达标，但分数没有余量，建议优先解决“会而不对、对而不全”的问题。',
                '建议以基础题为主线组织复习，先把必得分拿稳，再考虑拔高。',
                '整体水平偏低，建议在讲评时降低起点，从最简单的基础题开始重建信心。',
                '及格线上方空间狭窄，建议把每节课的目标压缩到一两个核心知识点，确保当堂过关。',
                '建议采用“小步快走”的方式，每节课只讲一个重点，配套当堂检测。',
                '当前分数没有容错空间，建议先抓解题规范，减少非知识性失分。'
            ],
            fail: [
                '整体未达及格线，建议暂停新课进度，系统梳理基础知识点，从最薄弱的环节补起。',
                '大面积不达标说明基础环节有系统性缺口，建议重新规划教学进度，先保证“会做的题不丢分”。',
                '当前成绩反映出前期教学存在明显遗漏，建议做一次全面的知识点诊断，再决定下一步重点。',
                '整体水平偏低，建议把教学目标分解成小步骤，逐个知识点确认过关。',
                '基础缺口比较大，建议先做减法——只保留最核心的必考内容，集中力量突破。',
                '建议暂停难题训练，把时间全部投入到基础概念和基本运算的巩固上。',
                '当前情况下不宜赶进度，建议先做一次摸底式复习，确认基础知识点逐一过关。',
                '建议把考试中最低频的难点先放一边，集中火力解决概念性、记忆性的基础内容。',
                '整体未达及格线，建议先重建学习信心，从最基础的题目开始积累成功体验。'
            ]
        };

        function suggestionKey(d) {
            if (d.mean >= 85) return d.std >= 15 ? 'highDiff' : 'highUniform';
            if (d.mean >= 70) return d.std >= 16 ? 'midDiff' : 'midUniform';
            if (d.mean >= 60) return 'lowPass';
            return 'fail';
        }

        function extraSuggestions(d) {
            const tips = [];

            if (d.counts.fail > 0) {
                const fr = d.counts.fail / d.n;
                if (fr >= 0.15) {
                    tips.push(`未通过的 ${d.counts.fail} 名同学建议建立单独的跟踪记录，把补差任务落实到具体知识点。`);
                } else {
                    tips.push(`未通过的 ${d.counts.fail} 名同学建议单独沟通，先弄清是知识问题还是状态问题。`);
                }
            }

            if (d.mean >= 70) {
                if (d.excellentRate < 8) {
                    tips.push('高分段人数偏少，讲评时可以多展示优秀解法，让中间层看到上升通道。');
                } else if (d.excellentRate >= 25) {
                    tips.push('高分段已经形成规模，可以让他们在小组内承担讲解任务，以讲促学。');
                }
            }

            if (d.std >= 16 && d.n >= 10) {
                tips.push('班级分化明显，建议以“基础+拓展”的形式分层布置每周任务。');
            }

            if (d.range >= 40) {
                tips.push('极差较大，建议在讲评时先统一基础题的解法，再单独安排难题的拓展。');
            }

            return tips;
        }

        function buildSuggestion(d, rng) {
            const main = pick(rng, suggestionPools[suggestionKey(d)]);
            const extras = extraSuggestions(d);
            const extra = extras.length > 0 ? extras[Math.floor(rng() * extras.length)] : '';
            return main + extra;
        }

        /* =========================================================
           四、评价组装
           —— seed 里包含 refreshSalt，刷新即可产出新评语
           ========================================================= */

        function buildOverview(d, rng) {
            const pool = overviewPools[d.level.key] || overviewPools.medium;
            return pick(rng, pool)(d);
        }

        function buildPass(d, rng) {
            if (d.n < 3) {
                return d.counts.fail === 0
                    ? `本次共 ${d.n} 条有效成绩，全部达到及格线。`
                    : `本次共 ${d.n} 条有效成绩，其中 ${d.counts.fail} 条未达及格线。`;
            }

            let key;
            if (d.counts.fail === 0) key = 'allPassed';
            else if (d.passRate >= 95) key = 'veryHigh';
            else if (d.passRate >= 85) key = 'high';
            else if (d.passRate >= 70) key = 'medium';
            else if (d.passRate >= 50) key = 'low';
            else key = 'veryLow';

            return pick(rng, passPools[key])(d);
        }

        function buildDispersion(d, rng) {
            if (d.dispersion.key === 'insufficient') {
                return d.n === 1
                    ? '本次只有 1 条成绩记录，各项统计指标仅供参考。'
                    : '本次只有 2 条成绩记录，样本量偏小，分布特征的参考价值有限。';
            }
            const pool = dispersionPools[d.dispersion.key] || dispersionPools.moderate;
            return pick(rng, pool)(d);
        }

        function buildEvaluation(d, salt) {
            if (!d || d.n === 0) return null;

            const seedStr = [
                d.n,
                fmt(d.mean),
                fmt(d.std),
                d.max,
                d.min,
                fmt(d.passRate, 1),
                'salt',
                salt
            ].join('|');

            const rng = createRng(hashString(seedStr));

            return {
                overview: buildOverview(d, rng),
                pass: buildPass(d, rng),
                dispersion: buildDispersion(d, rng),
                extremes: buildExtremes(d, rng),
                structure: buildStructure(d, rng),
                suggestion: buildSuggestion(d, rng)
            };
        }

        function hasSameContent(a, b) {
            if (!a || !b) return false;
            return a.overview === b.overview &&
                a.pass === b.pass &&
                a.dispersion === b.dispersion &&
                a.extremes === b.extremes &&
                a.structure === b.structure &&
                a.suggestion === b.suggestion;
        }

        /* =========================================================
           五、DOM 与交互
           ========================================================= */
        const scoreInput = document.getElementById('scoreInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const toggleEvaluationBtn = document.getElementById('toggleEvaluationBtn');
        const refreshEvaluationBtn = document.getElementById('refreshEvaluationBtn');
        const refreshBadge = document.getElementById('refreshBadge');

        const totalStudentsEl = document.getElementById('totalStudents');
        const range0_59El = document.getElementById('range0_59');
        const range60_69El = document.getElementById('range60_69');
        const range70_79El = document.getElementById('range70_79');
        const range80_89El = document.getElementById('range80_89');
        const range90_100El = document.getElementById('range90_100');
        const averageScoreEl = document.getElementById('averageScore');
        const averageDeviationEl = document.getElementById('averageDeviation');
        const standardDeviationEl = document.getElementById('standardDeviation');
        const passRateEl = document.getElementById('passRate');
        const evaluationTextEl = document.getElementById('evaluationText');

        let isDetailedEvaluation = false;
        let currentDimensions = null;
        let currentEvalParts = null;   // 当前缓存的评语内容
        let refreshSalt = 0;           // 刷新计数器，作为随机种子的一部分

        function updateResults(d) {
            if (!d) {
                totalStudentsEl.textContent = '0';
                range0_59El.textContent = '0';
                range60_69El.textContent = '0';
                range70_79El.textContent = '0';
                range80_89El.textContent = '0';
                range90_100El.textContent = '0';
                averageScoreEl.textContent = '0';
                averageDeviationEl.textContent = '0';
                standardDeviationEl.textContent = '0';
                passRateEl.textContent = '0';
                return;
            }
            totalStudentsEl.textContent = d.n;
            range0_59El.textContent = d.counts.fail;
            range60_69El.textContent = d.counts.d60;
            range70_79El.textContent = d.counts.d70;
            range80_89El.textContent = d.counts.d80;
            range90_100El.textContent = d.counts.d90;
            averageScoreEl.textContent = fmt(d.mean);
            averageDeviationEl.textContent = fmt(d.mad);
            standardDeviationEl.textContent = fmt(d.std);
            passRateEl.textContent = fmt(d.passRate, 1);
        }

        // 只负责“渲染”当前缓存内容，绝不修改 refreshSalt
        function renderEvaluation() {
            if (!currentDimensions) {
                evaluationTextEl.textContent = '请先输入成绩数据再进行分析。';
                return;
            }
            if (!currentEvalParts) {
                currentEvalParts = buildEvaluation(currentDimensions, refreshSalt);
            }

            const parts = currentEvalParts;

            if (isDetailedEvaluation) {
                evaluationTextEl.innerHTML = [
                    `<p><span class="highlight">整体表现：</span>${parts.overview}</p>`,
                    `<p><span class="highlight">通过情况：</span>${parts.pass}</p>`,
                    `<p><span class="highlight">分数分布：</span>${parts.dispersion}</p>`,
                    `<p><span class="highlight">极值分析：</span>${parts.extremes}</p>`,
                    `<p><span class="highlight">分数段结构：</span>${parts.structure}</p>`,
                    `<p><span class="highlight">教学建议：</span>${parts.suggestion}</p>`
                ].join('');
            } else {
                evaluationTextEl.textContent = [
                    parts.overview,
                    parts.pass,
                    parts.dispersion
                ].join('\n');
            }
        }

        // 生成新一轮评语并缓存（供分析与刷新按钮调用）
        function regenerateEvaluationParts() {
            if (!currentDimensions) return;

            const prev = currentEvalParts;
            let parts = buildEvaluation(currentDimensions, refreshSalt);
            let tries = 0;

            // 如果与上一轮完全相同，则换一个 salt 再试
            while (prev && hasSameContent(parts, prev) && tries < 10) {
                refreshSalt++;
                parts = buildEvaluation(currentDimensions, refreshSalt);
                tries++;
            }

            currentEvalParts = parts;
        }

        function updateRefreshBadge() {
            refreshBadge.textContent = refreshSalt > 0 ? `已刷新 ${refreshSalt} 次` : '';
        }

        function analyzeScores() {
            const scores = scoreInput.value.split('\n')
                .map(line => line.trim())
                .filter(line => line !== '' && !isNaN(Number(line)))
                .map(Number)
                .filter(s => s >= 0 && s <= 100);

            if (scores.length === 0) {
                currentDimensions = null;
                currentEvalParts = null;
                refreshSalt = 0;
                updateResults(null);
                evaluationTextEl.textContent = '请先输入成绩数据再进行分析。';
                refreshEvaluationBtn.disabled = true;
                updateRefreshBadge();
                return;
            }

            currentDimensions = computeDimensions(scores);
            refreshSalt = 0;
            currentEvalParts = null;
            updateResults(currentDimensions);
            regenerateEvaluationParts();   // 用 salt=0 生成首轮评语
            renderEvaluation();
            updateRefreshBadge();
            refreshEvaluationBtn.disabled = false;
        }

        function clearForm() {
            scoreInput.value = '';
            currentDimensions = null;
            currentEvalParts = null;
            refreshSalt = 0;
            isDetailedEvaluation = false;
            toggleEvaluationBtn.textContent = '显示详细评价';
            updateResults(null);
            evaluationTextEl.textContent = '';
            refreshEvaluationBtn.disabled = true;
            updateRefreshBadge();
        }

        // 切换简略/详细：仅改变渲染方式，不重新生成评语、不增加刷新次数
        function toggleEvaluation() {
            if (!currentDimensions) return;
            isDetailedEvaluation = !isDetailedEvaluation;
            toggleEvaluationBtn.textContent = isDetailedEvaluation ? '显示简略评价' : '显示详细评价';
            renderEvaluation();
        }

        // 刷新：重新生成一轮评语（salt 递增）
        function refreshEvaluation() {
            if (!currentDimensions) return;
            refreshSalt++;
            regenerateEvaluationParts();
            renderEvaluation();
            updateRefreshBadge();
        }

        analyzeBtn.addEventListener('click', analyzeScores);
        clearBtn.addEventListener('click', clearForm);
        toggleEvaluationBtn.addEventListener('click', toggleEvaluation);
        refreshEvaluationBtn.addEventListener('click', refreshEvaluation);

        scoreInput.addEventListener('keydown', function (e) {
            if (e.ctrlKey && e.key === 'Enter') {
                analyzeScores();
            }
        });
    </script>
