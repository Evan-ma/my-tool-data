<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b5cff">
<title>值班表</title>
<style>
:root{
  --brand:#2b5cff;
  --bg:#f4f6fb;
  --card:#fff;
  --line:#eaedf5;
  --txt:#1e2430;
  --muted:#7d879c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:680px;margin:0 auto;padding:18px 14px 40px}

/* ---------- 顶部标题 ---------- */
.head{padding:4px 2px 16px}
.head h1{
  font-size:19px;font-weight:700;margin:0;letter-spacing:.3px;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
}
.head .count{
  font-size:12px;font-weight:500;color:var(--muted);
  background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:2px 10px;
}

/* ---------- 今日卡片 ---------- */
.today{
  background:linear-gradient(135deg,#2b5cff,#5f8bff);
  color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:16px;
  box-shadow:0 8px 22px rgba(43,92,255,.25);
}
.today .lbl{
  font-size:12.5px;opacity:.85;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.today .lbl b{font-weight:600}
.today .ppl{display:flex;flex-wrap:wrap;gap:8px}
.today .p{
  background:rgba(255,255,255,.22);border-radius:10px;
  padding:7px 13px;font-size:15px;display:flex;align-items:baseline;gap:8px;
}
.today .p a{color:#fff;text-decoration:none;font-size:12.5px;opacity:.92}
.today .p a:active{opacity:1}

/* ---------- 搜索 ---------- */
.search{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin-bottom:14px;
}
.search svg{flex:0 0 16px;color:var(--muted)}
.search input{
  flex:1;border:0;outline:none;background:transparent;font:inherit;
  font-size:14px;color:var(--txt);min-width:0;
}
.search input::placeholder{color:#aab2c4}
.search .clear{
  border:0;background:#eef1f8;color:var(--muted);border-radius:50%;
  width:20px;height:20px;line-height:1;font-size:13px;cursor:pointer;
  display:none;align-items:center;justify-content:center;flex:0 0 20px;
}
.search .clear.show{display:flex}

/* ---------- 日期列表 ---------- */
.list{display:flex;flex-direction:column;gap:9px}
.day{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border-radius:12px;padding:12px 14px;
  border:1px solid transparent;
  box-shadow:0 1px 2px rgba(20,30,60,.04);
  transition:.15s;
}
.day.is-today{
  border-color:#cfdcff;background:#f4f7ff;
  box-shadow:0 4px 14px rgba(43,92,255,.13);
}
/* 昨天：灰色显示 */
.day.is-past{
  opacity:.55;
  background:#f7f8fb;
  box-shadow:none;
}
.day.is-past .dd{color:#9aa3b5}
.day.is-past .person{background:#eef1f7}

/* 月份分隔条 */
.month-sep{
  font-size:12.5px;font-weight:600;color:var(--muted);
  padding:10px 4px 2px;letter-spacing:.4px;
}

.day .date{
  flex:0 0 62px;display:flex;flex-direction:column;
}
.day .dd{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.day .wk{font-size:11.5px;color:var(--muted);margin-top:1px}
.day.is-today .dd{color:var(--brand)}
.day .people{
  flex:1;display:flex;flex-wrap:wrap;gap:6px 8px;min-width:0;
}
.person{
  display:inline-flex;align-items:baseline;gap:6px;
  background:#f3f6fd;border-radius:8px;padding:5px 10px;font-size:13.5px;
}
.person .nm{font-weight:600;white-space:nowrap}
.person .tel{
  color:var(--brand);text-decoration:none;font-size:12px;
  font-variant-numeric:tabular-nums;
}
.person .tel:active{opacity:.6}
.badge{
  font-size:10.5px;font-weight:600;color:#fff;background:var(--brand);
  border-radius:5px;padding:0 5px;line-height:16px;align-self:center;
}

/* ---------- 备注 ---------- */
.note{
  margin-top:16px;background:#fffdf5;border:1px solid #f3e4b5;
  border-radius:12px;padding:12px 14px;font-size:12.5px;color:#7a5f1a;
  line-height:1.8;white-space:pre-wrap;
}
.note b{color:#8a6a14}
.note-item + .note-item{margin-top:10px;padding-top:10px;border-top:1px dashed #ecd9a0}
.note-tt{font-weight:700;margin-bottom:2px;color:#8a6a14}

/* ---------- 空状态 ---------- */
.empty{
  text-align:center;color:var(--muted);font-size:14px;
  padding:44px 16px;line-height:2;
}
.empty code{
  background:#eef1f8;border-radius:5px;padding:2px 6px;font-size:12px;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:#3a4a66;
  word-break:break-all;
}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.5}

/* ---------- 复制提示 ---------- */
#tip{
  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);
  background:rgba(28,34,48,.92);color:#fff;padding:9px 18px;border-radius:9px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:99;
  white-space:nowrap;max-width:90vw;
}
#tip.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:420px){
  .wrap{padding:14px 11px 32px}
  .head h1{font-size:17px}
  .today{padding:14px 15px}
  .today .p{padding:6px 11px;font-size:14px}
  .day{padding:10px 12px;gap:10px}
  .day .date{flex:0 0 56px}
  .day .dd{font-size:14px}
  .person{padding:4px 8px;font-size:12.5px}
  .person .tel{font-size:11px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="head" id="head" hidden>
    <h1><span id="title"></span><span class="count" id="count"></span></h1>
  </div>

  <div id="todayBox"></div>

  <div class="search" id="searchBox" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="search" type="search" placeholder="搜索姓名 / 电话 / 日期" autocomplete="off">
    <button class="clear" id="clearBtn" type="button" aria-label="清空">×</button>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="note" id="note" hidden></div>
</div>

<div id="tip"></div>

<!-- ============================================================
     数据引用区：只引用 duty-data.js 一个文件。
     以后增删改月份，只修改 duty-data.js，本文件不用再动。
     如果改了数据页面没变化，给 ?v= 后面的数字加一即可。
     ============================================================ -->
<script src="https://evan-ma.github.io/my-tool-data/duty-data.js?v=1"></script>

<script>
(function () {
  'use strict';

  const $  = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');

  let tipTimer;
  function toast(msg){
    const t = $('tip');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => t.classList.remove('show'), 1500);
  }

  function copyText(text){
    if (navigator.clipboard && window.isSecureContext)
      return navigator.clipboard.writeText(text);
    return new Promise((res, rej) => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy') ? res() : rej(); }
      catch(e){ rej(e); }
      document.body.removeChild(ta);
    });
  }

  /* =========================================================
   *  数据规范化：把各种格式统一成「月份数组」
   *  支持 { months:[...] } 新版，也兼容旧的单月结构
   * ========================================================= */
  function normalize(raw){
    if (!raw || typeof raw !== 'object') return [];
    let months;
    if (Array.isArray(raw.months))    months = raw.months;
    else if (Array.isArray(raw.ds))   months = [raw];   // 兼容旧版单月
    else return [];

    return months
      .filter(mo => mo && Number.isInteger(mo.y) && Number.isInteger(mo.m)
                    && Array.isArray(mo.ds))
      .map(mo => ({
        y : mo.y,
        m : mo.m,
        ti: mo.ti || '',
        no: mo.no || '',
        ds: mo.ds.filter(x => Array.isArray(x) && Array.isArray(x[2]))
      }))
      .filter(mo => mo.ds.length)
      .sort((a, b) => (a.y - b.y) || (a.m - b.m));
  }

  /* =========================================================
   *  展开成按真实日期排序的连续行
   *  diff: 0=今天  -1=昨天  -2=前天 ...
   * ========================================================= */
  function flatten(months){
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const rows = [];

    months.forEach(mo => {
      mo.ds.forEach(([d, wk, ppl]) => {
        if (!Number.isInteger(d)) return;
        const date = new Date(mo.y, mo.m - 1, d);
        date.setHours(0, 0, 0, 0);
        rows.push({
          date,
          diff: Math.round((date - today) / 86400000),
          y: mo.y, m: mo.m, d,
          wk: String(wk || ''),
          ppl: ppl.filter(p => Array.isArray(p) && p[0]),
        });
      });
    });

    rows.sort((a, b) => a.date - b.date);
    return rows;
  }

  /* =========================================================
   *  渲染
   * ========================================================= */
  function peopleList(ppl){
    return ppl.map(([n, p]) => `<span class="person">
        <span class="nm">${esc(n)}</span>
        ${p ? `<a class="tel" href="tel:${esc(p)}" data-phone="${esc(p)}">${esc(p)}</a>` : ''}
      </span>`).join('');
  }
  function peopleToday(ppl){
    return ppl.map(([n, p]) =>
      `<span class="p">${esc(n)}${p ? `<a href="tel:${esc(p)}">${esc(p)}</a>` : ''}</span>`
    ).join('');
  }

  function render(months){
    const rows = flatten(months);

    $('head').hidden = false;
    $('searchBox').hidden = false;

    /* ---- 标题 ---- */
    const a = months[0], b = months[months.length - 1];
    let title;
    if (months.length === 1) title = a.ti || `${a.y}年${a.m}月值班表`;
    else if (a.y === b.y)    title = `${a.y}年${a.m}月—${b.m}月值班表`;
    else                     title = `${a.y}年${a.m}月—${b.y}年${b.m}月值班表`;

    $('title').textContent = title;
    $('count').textContent = months.length > 1
      ? `${months.length} 个月 · ${rows.length} 天`
      : `${rows.length} 天`;

    /* ---- 今日卡片 ---- */
    const todayBox = $('todayBox');
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const t = rows.find(r => r.diff === 0);

    if (t){
      todayBox.innerHTML = `<div class="today">
        <div class="lbl"><b>今日值班</b>· ${t.y}年${t.m}月${t.d}日 周${esc(t.wk)}</div>
        <div class="ppl">${peopleToday(t.ppl)}</div>
      </div>`;
    } else if (rows.length && rows[0].date <= now && now <= rows[rows.length - 1].date){
      todayBox.innerHTML = `<div class="today">
        <div class="lbl"><b>今日</b>· ${now.getMonth() + 1}月${now.getDate()}日</div>
        <div class="ppl"><span class="p" style="opacity:.85">无值班安排</span></div>
      </div>`;
    } else {
      todayBox.innerHTML = '';
    }

    /* ---- 日期列表（跨月连续 + 月份分隔条） ---- */
    const parts = [];
    let lastYM = -1;

    rows.forEach(r => {
      const ym = r.y * 100 + r.m;

      if (ym !== lastYM){
        lastYM = ym;
        parts.push(`<div class="month-sep" data-ym="${ym}">${r.y}年${r.m}月</div>`);
      }

      const isToday = r.diff === 0;
      const isPast  = r.diff === -1;
      const hidden  = r.diff < -1;      // 前天及更早：默认隐藏

      const searchStr = [
        `${r.y}年${r.m}月${r.d}日`, `${r.m}/${pad(r.d)}`, `${r.m}-${pad(r.d)}`,
        `周${r.wk}`, `星期${r.wk}`, ...r.ppl.flat()
      ].join(' ').toLowerCase();

      parts.push(`<div class="day${isToday ? ' is-today' : ''}${isPast ? ' is-past' : ''}"
          data-ym="${ym}"
          data-hidden="${hidden ? 1 : 0}"
          data-search="${esc(searchStr)}"
          ${hidden ? 'style="display:none"' : ''}>
        <div class="date">
          <span class="dd">${r.m}/${pad(r.d)}</span>
          <span class="wk">周${esc(r.wk)}</span>
        </div>
        <div class="people">${peopleList(r.ppl)}${isToday ? '<span class="badge">今天</span>' : ''}</div>
      </div>`);
    });

    $('list').innerHTML = parts.join('');

    /* ---- 备注（按月份分组） ---- */
    // const noteEl = $('note');
    // const notes = months.filter(m => (m.no || '').trim());
    // if (notes.length){
    //   noteEl.hidden = false;
    //   noteEl.innerHTML = notes.map(m => `
    //     <div class="note-item">
    //       ${notes.length > 1 ? `<div class="note-tt">${m.y}年${m.m}月</div>` : ''}
    //       <b>备注</b><br>${esc(m.no.replace(/^备注[:：]?\s*/, ''))}
    //     </div>`).join('');
    // } else {
    //   noteEl.hidden = true;
    // }

    filter('');
  }

  /* =========================================================
   *  搜索过滤
   *   - 无关键词：隐藏「前天及更早」，昨天灰显
   *   - 有关键词：所有日期都参与匹配（可查历史）
   * ========================================================= */
  const searchInput = $('search');
  const clearBtn = $('clearBtn');
  const emptyEl = $('empty');

  function filter(q){
    q = (q || '').trim().toLowerCase();
    const visibleYM = new Set();
    let shown = 0;

    document.querySelectorAll('#list .day').forEach(el => {
      const pastHidden = el.dataset.hidden === '1';
      const ok = q ? el.dataset.search.includes(q) : !pastHidden;
      el.style.display = ok ? '' : 'none';
      if (ok){ shown++; visibleYM.add(el.dataset.ym); }
    });

    /* 月份分隔条跟随其下日期显隐 */
    document.querySelectorAll('#list .month-sep').forEach(el => {
      el.style.display = visibleYM.has(el.dataset.ym) ? '' : 'none';
    });

    clearBtn.classList.toggle('show', !!q);

    if (shown === 0){
      emptyEl.hidden = false;
      emptyEl.innerHTML = q
        ? `<div class="big">🔍</div>没有找到与「${esc(q)}」匹配的值班记录`
        : `<div class="big">✓</div>暂无后续值班安排`;
    } else {
      emptyEl.hidden = true;
    }
  }

  searchInput.addEventListener('input', e => filter(e.target.value));
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    filter('');
    searchInput.focus();
  });

  /* ---------- 电话点击：触屏拨号，桌面复制 ---------- */
  const isTouch = window.matchMedia && window.matchMedia('(hover: none)').matches;
  $('list').addEventListener('click', e => {
    const a = e.target.closest('.tel');
    if (!a || isTouch) return;
    e.preventDefault();
    copyText(a.dataset.phone)
      .then(() => toast('已复制 ' + a.dataset.phone))
      .catch(() => {});
  });

  /* ---------- 启动 ---------- */
  function boot(){
    const raw = (window.DUTY_DATA && (window.DUTY_DATA.months || window.DUTY_DATA.ds))
      ? window.DUTY_DATA
      : null;

    const months = normalize(raw);

    if (!months.length){
      $('empty').hidden = false;
      $('empty').innerHTML =
        `<div class="big">📋</div>
         暂未加载值班数据<br>
         请确保 <code>duty-data.js</code> 与本文件在同一目录，<br>
         并且已正确设置 <code>window.DUTY_DATA</code>。`;
      return;
    }

    render(months);
  }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else
    boot();
})();
</script>
</body>
</html>
